<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Presensi Digital | LPKC SMKN 1 Pakong</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .presensi-page {
            min-height: 100vh;
            padding: 45px 20px 60px;
            box-sizing: border-box;
        }

        .presensi-wrapper {
            max-width: 650px;
            margin: auto;
        }

        .presensi-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .icon-presensi {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .presensi-header h1 {
            margin: 0;
            font-size: 30px;
        }

        .presensi-header p {
            margin-top: 8px;
            opacity: 0.75;
        }

        .presensi-card {
            background: #ffffff;
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        }

        .waktu-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .waktu-item {
            background: #f5f7f9;
            border-radius: 14px;
            padding: 14px;
            text-align: center;
        }

        .waktu-item span {
            display: block;
            margin-top: 5px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {

            width: 100%;
            padding: 13px 14px;
            box-sizing: border-box;

            border: 1px solid #d8dde2;
            border-radius: 12px;

            font-size: 15px;
            font-family: inherit;

            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {

            border-color: #6b8e7b;

            box-shadow:
                0 0 0 3px
                rgba(107,142,123,0.12);
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .btn-kirim {

            width: 100%;
            padding: 15px;

            border: none;
            border-radius: 13px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            background: #6b8e7b;
            color: white;
        }

        .btn-kirim:hover {
            opacity: 0.9;
        }

        .btn-kirim:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .pesan {

            text-align: center;

            margin-top: 18px;

            font-weight: bold;

            min-height: 24px;
        }

        .catatan-presensi {

            margin-top: 20px;

            padding: 15px;

            background: #f8f9fa;

            border-radius: 12px;

            font-size: 13px;

            line-height: 1.6;
        }

        @media (max-width: 600px) {

            .presensi-page {
                padding: 30px 15px 45px;
            }

            .presensi-card {
                padding: 22px 18px;
                border-radius: 18px;
            }

            .presensi-header h1 {
                font-size: 25px;
            }

            .waktu-box {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header class="navbar">

    <div class="logo">

        <img
            src="LOGOSMKN1PAKONG.jpg"
            alt="Logo SMKN 1 Pakong">

        <div>

            <span>LPKC</span>

            <small>
                SMKN 1 PAKONG
            </small>

        </div>

    </div>


    <nav>

        <a href="index.html">
            Beranda
        </a>

        <a href="profil-lpkc.html">
            Profil Pengelola
        </a>

        <a href="kelas.html">
            Pembelajaran
        </a>

        <a href="penilaian.html">
            Penilaian
        </a>

        <a href="presensi.html">
            Presensi
        </a>

        <a href="sumber.html">
            Sumber Belajar
        </a>

    </nav>

</header>


<main class="presensi-page">

    <div class="presensi-wrapper">


        <div class="presensi-header">

            <div class="icon-presensi">
                📝
            </div>

            <h1>
                Presensi Digital
            </h1>

            <p>
                LPKC SMKN 1 Pakong
            </p>

        </div>


        <div class="presensi-card">


            <!-- TANGGAL DAN JAM -->

            <div class="waktu-box">

                <div class="waktu-item">

                    📅

                    <span id="tanggal">
                        -
                    </span>

                </div>


                <div class="waktu-item">

                    ⏰

                    <span id="jam">
                        -
                    </span>

                </div>

            </div>


            <!-- FORM -->

            <form id="formPresensi">


                <!-- NAMA -->

                <div class="form-group">

                    <label for="nama">
                        👤 Nama Siswa
                    </label>

                    <input
                        type="text"
                        id="nama"
                        placeholder="Masukkan nama lengkap"
                        required>

                </div>


                <!-- NIS -->

                <div class="form-group">

                    <label for="nis">
                        🆔 NIS
                    </label>

                    <input
                        type="text"
                        id="nis"
                        placeholder="Masukkan NIS"
                        required>

                </div>


                <!-- KELAS -->

                <div class="form-group">

                    <label for="kelas">
                        🏫 Kelas
                    </label>

                    <select id="kelas" required>

                        <option value="">
                            -- Pilih Kelas --
                        </option>

                        <option value="X">
                            X
                        </option>

                        <option value="XI">
                            XI
                        </option>

                        <option value="XII">
                            XII
                        </option>

                    </select>

                </div>


                <!-- MATA PELAJARAN -->

                <div class="form-group">

                    <label for="mapel">
                        📚 Mata Pelajaran
                    </label>

                    <input
                        type="text"
                        id="mapel"
                        placeholder="Masukkan mata pelajaran"
                        required>

                </div>


                <!-- MATERI -->

                <div class="form-group">

                    <label for="materi">
                        📖 Materi
                    </label>

                    <input
                        type="text"
                        id="materi"
                        placeholder="Masukkan materi yang dipelajari"
                        required>

                </div>


                <!-- STATUS -->

                <div class="form-group">

                    <label for="status">
                        ✅ Status Kehadiran
                    </label>

                    <select id="status" required>

                        <option value="">
                            -- Pilih Status --
                        </option>

                        <option value="Hadir">
                            Hadir
                        </option>

                        <option value="Sakit">
                            Sakit
                        </option>

                        <option value="Izin">
                            Izin
                        </option>

                    </select>

                </div>


                <!-- KETERANGAN -->

                <div class="form-group">

                    <label for="keterangan">
                        📝 Keterangan
                    </label>

                    <textarea
                        id="keterangan"
                        placeholder="Keterangan tambahan (opsional)">
                    </textarea>

                </div>


                <!-- TOMBOL KIRIM -->

                <button
                    type="submit"
                    class="btn-kirim"
                    id="btnKirim">

                    ✅ KIRIM PRESENSI

                </button>


                <!-- PESAN -->

                <div
                    id="pesan"
                    class="pesan">
                </div>


            </form>


            <div class="catatan-presensi">

                💡 <strong>Catatan:</strong>

                Silakan isi data presensi dengan benar.
                Setelah menekan tombol
                <strong>KIRIM PRESENSI</strong>,
                data akan tersimpan secara otomatis.

            </div>


        </div>

    </div>

</main>


<footer>

    <p>
        © 2026 LPKC SMKN 1 Pakong
    </p>

</footer>


<script>

    /* ==============================
       TANGGAL DAN JAM
    ============================== */

    function updateWaktu() {

        const sekarang = new Date();

        const tanggal =
            sekarang.toLocaleDateString(
                "id-ID",
                {
                    weekday: "long",
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            );

        const jam =
            sekarang.toLocaleTimeString(
                "id-ID"
            );

        document.getElementById("tanggal")
            .textContent = tanggal;

        document.getElementById("jam")
            .textContent = jam;

    }


    updateWaktu();

    setInterval(
        updateWaktu,
        1000
    );


    /* ==============================
       KIRIM DATA PRESENSI
    ============================== */

    const URL_SCRIPT =
        "https://script.google.com/macros/s/AKfycbzYZSnnqp52UJfoJ3rqFDzdoP8ckadVpRzNcbaXwbU2mYnJX-wnQ2C9qnMXma8wLWNR/exec";


    document
        .getElementById("formPresensi")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const tombol =
                    document.getElementById(
                        "btnKirim"
                    );

                const pesan =
                    document.getElementById(
                        "pesan"
                    );


                tombol.disabled = true;

                tombol.textContent =
                    "⏳ Mengirim...";


                const sekarang =
                    new Date();


                const data = {

                    tanggal:
                        sekarang.toLocaleDateString(
                            "id-ID"
                        ),

                    jam:
                        sekarang.toLocaleTimeString(
                            "id-ID"
                        ),

                    nama:
                        document
                            .getElementById("nama")
                            .value,

                    nis:
                        document
                            .getElementById("nis")
                            .value,

                    kelas:
                        document
                            .getElementById("kelas")
                            .value,

                    mapel:
                        document
                            .getElementById("mapel")
                            .value,

                    materi:
                        document
                            .getElementById("materi")
                            .value,

                    status:
                        document
                            .getElementById("status")
                            .value,

                    keterangan:
                        document
                            .getElementById("keterangan")
                            .value

                };


                try {

                    await fetch(
                        URL_SCRIPT,
                        {

                            method: "POST",

                            mode: "no-cors",

                            headers: {
                                "Content-Type":
                                    "text/plain;charset=utf-8"
                            },

                            body:
                                JSON.stringify(data)

                        }
                    );


                    pesan.textContent =
                        "✅ Presensi berhasil dikirim.";

                    pesan.style.color =
                        "#2e7d32";


                    document
                        .getElementById(
                            "formPresensi"
                        )
                        .reset();


                } catch (error) {

                    pesan.textContent =
                        "❌ Presensi gagal dikirim.";

                    pesan.style.color =
                        "#c62828";

                }


                tombol.disabled = false;

                tombol.textContent =
                    "✅ KIRIM PRESENSI";

            }
        );

</script>


</body>

</html>

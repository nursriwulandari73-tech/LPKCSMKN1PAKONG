<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <meta name="viewport"

    <title>Presensi Digital | LPKC SMKN 1 Pakong</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* ==============================
           HALAMAN PRESENSI
        ============================== */

        .presensi-page {
            min-height: 100vh;
            padding: 45px 20px 60px;
            box-sizing: border-box;
        }

        .presensi-wrapper {
            max-width: 650px;
            margin: auto;
        }

        .presensi-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .presensi-header .icon-presensi {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .presensi-header h1 {
            margin: 0;
            font-size: 30px;
        }

        .presensi-header p {
            margin-top: 8px;
            opacity: 0.75;
        }

        /* KARTU */

        .presensi-card {
            background: #ffffff;
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        }

        /* TANGGAL DAN JAM */

        .waktu-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .waktu-item {
            background: #f5f7f9;
            border-radius: 14px;
            padding: 14px;
            text-align: center;
        }

        .waktu-item span {
            display: block;
            margin-top: 5px;
            font-weight: bold;
        }

        /* FORM */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 13px 14px;
            box-sizing: border-box;

            border: 1px solid #d8dde2;
            border-radius: 12px;

            font-size: 15px;
            font-family: inherit;

            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #6b8e7b;
            box-shadow: 0 0 0 3px rgba(107,142,123,0.12);
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        /* TOMBOL */

        .btn-kirim {
            width: 100%;
            padding: 15px;

            border: none;
            border-radius: 13px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            background: #6b8e7b;
            color: white;

            transition: 0.2s;
        }

        .btn-kirim:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-kirim:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        /* PESAN */

        .pesan {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
            min-height: 24px;
        }

        /* CATATAN */

        .catatan-presensi {
            margin-top: 20px;
            padding: 15px;

            background: #f8f9fa;
            border-radius: 12px;

            font-size: 13px;
            line-height: 1.6;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .presensi-page {
                padding: 30px 15px 45px;
            }

            .presensi-card {
                padding: 22px 18px;
                border-radius: 18px;
            }

            .presensi-header h1 {
                font-size: 25px;
            }

            .waktu-box {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Presensi Digital | LPKC SMKN 1 Pakong</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .presensi-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
        }

        .presensi-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.10);
        }

        .presensi-card h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .presensi-card .subjudul {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .btn-kirim {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .pesan {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }

        .tanggal-jam {
            background: #f4f4f4;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">

            <img src="LOGOSMKN1PAKONG.jpg"
                 alt="Logo SMKN 1 Pakong">

            <div>

                <span>LPKC</span>

                <small>
                    SMKN 1 PAKONG
                </small>

            </div>

        </div>


        <nav>

            <a href="index.html">
                Beranda
            </a>

            <a href="profil-lpkc.html">
                Profil Pengelola
            </a>

            <a href="kelas.html">
                Pembelajaran
            </a>

            <a href="penilaian.html">
                Penilaian
            </a>

            <a href="presensi.html">
                Presensi
            </a>

            <a href="sumber.html">
                Sumber Belajar
            </a>

        </nav>

    </header>



    <!-- PRESENSI -->

    <main class="presensi-container">

        <div class="presensi-card">

            <h1>
                📝 Presensi Digital
            </h1>

            <p class="subjudul">
                LPKC SMKN 1 Pakong
            </p>


            <div class="tanggal-jam">

                <div>
                    📅 <span id="tanggal"></span>
                </div>

                <div>
                    ⏰ <span id="jam"></span>
                </div>

            </div>


            <form id="formPresensi">


                <!-- NAMA -->

                <div class="form-group">

                    <label>
                        Nama Siswa
                    </label>

                    <input
                        type="text"
                        id="nama"
                        placeholder="Masukkan nama lengkap"
                        required>

                </div>


                <!-- NIS -->

                <div class="form-group">

                    <label>
                        NIS
                    </label>

                    <input
                        type="text"
                        id="nis"
                        placeholder="Masukkan NIS"
                        required>

                </div>


                <!-- KELAS -->

                <div class="form-group">

                    <label>
                        Kelas
                    </label>

                    <select id="kelas" required>

                        <option value="">
                            -- Pilih Kelas --
                        </option>

                        <option value="X">
                            X
                        </option>

                        <option value="XI">
                            XI
                        </option>

                        <option value="XII">
                            XII
                        </option>

                    </select>

                </div>


                <!-- MATA PELAJARAN -->

                <div class="form-group">

                    <label>
                        Mata Pelajaran
                    </label>

                    <input
                        type="text"
                        id="mapel"
                        placeholder="Contoh: KDTK"
                        required>

                </div>


                <!-- MATERI -->

                <div class="form-group">

                    <label>
                        Materi
                    </label>

                    <input
                        type="text"
                        id="materi"
                        placeholder="Materi yang dipelajari"
                        required>

                </div>


                <!-- STATUS -->

                <div class="form-group">

                    <label>
                        Status Kehadiran
                    </label>

                    <select id="status" required>

                        <option value="">
                            -- Pilih Status --
                        </option>

                        <option value="Hadir">
                            Hadir
                        </option>

                        <option value="Sakit">
                            Sakit
                        </option>

                        <option value="Izin">
                            Izin
                        </option>

                    </select>

                </div>


                <!-- KETERANGAN -->

                <div class="form-group">

                    <label>
                        Keterangan
                    </label>

                    <textarea
                        id="keterangan"
                        placeholder="Keterangan jika diperlukan"></textarea>

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="btn-kirim">

                    ✅ KIRIM PRESENSI

                </button>


                <div
                    id="pesan"
                    class="pesan">
                </div>


            </form>

        </div>

    </main>



    <!-- FOOTER -->

    <footer>

        <h3>
            LPKC SMKN 1 PAKONG
        </h3>

        <p>
            Learning & Practice Center
        </p>

        <small>
            © 2026 LPKC SMKN 1 Pakong
        </small>

    </footer>



    <!-- SCRIPT -->

    <script>

        const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbzYZSnnqp52UJfoJ3rqFDzdoP8ckadVpRzNcbaXwbU2mYnJX-wnQ2C9qnMXma8wLWNR/exec";


        // TANGGAL DAN JAM

        function tampilkanWaktu() {

            const sekarang = new Date();

            const tanggal =
                sekarang.toLocaleDateString(
                    "id-ID",
                    {
                        day: "2-digit",
                        month: "2-digit",
                        year: "numeric"
                    }
                );

            const jam =
                sekarang.toLocaleTimeString(
                    "id-ID"
                );

            document.getElementById("tanggal")
                .textContent = tanggal;

            document.getElementById("jam")
                .textContent = jam;

        }


        tampilkanWaktu();

        setInterval(
            tampilkanWaktu,
            1000
        );


        // KIRIM PRESENSI

        document
            .getElementById("formPresensi")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const tombol =
                        document.querySelector(
                            ".btn-kirim"
                        );

                    const pesan =
                        document.getElementById(
                            "pesan"
                        );


                    tombol.disabled = true;

                    tombol.textContent =
                        "⏳ Mengirim...";


                    const sekarang =
                        new Date();


                    const data = {

                        tanggal:
                            sekarang.toLocaleDateString(
                                "id-ID"
                            ),

                        jam:
                            sekarang.toLocaleTimeString(
                                "id-ID"
                            ),

                        nama:
                            document.getElementById(
                                "nama"
                            ).value,

                        nis:
                            document.getElementById(
                                "nis"
                            ).value,

                        kelas:
                            document.getElementById(
                                "kelas"
                            ).value,

                        mapel:
                            document.getElementById(
                                "mapel"
                            ).value,

                        materi:
                            document.getElementById(
                                "materi"
                            ).value,

                        status:
                            document.getElementById(
                                "status"
                            ).value,

                        keterangan:
                            document.getElementById(
                                "keterangan"
                            ).value

                    };


                    try {

                        await fetch(
                            SCRIPT_URL,
                            {
                                method: "POST",

                                mode: "no-cors",

                                headers: {
                                    "Content-Type":
                                        "text/plain;charset=utf-8"
                                },

                                body:
                                    JSON.stringify(data)
                            }
                        );


                        pesan.textContent =
                            "✅ Presensi berhasil dikirim.";

                        document
                            .getElementById(
                                "formPresensi"
                            )
                            .reset();


                    } catch (error) {

                        pesan.textContent =
                            "❌ Presensi gagal dikirim. Silakan coba lagi.";

                        console.error(error);

                    }


                    tombol.disabled = false;

                    tombol.textContent =
                        "✅ KIRIM PRESENSI";

                }
            );

    </script>


</body>

</html>

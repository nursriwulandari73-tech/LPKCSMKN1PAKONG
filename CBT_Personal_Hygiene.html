<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CBT Personal Hygiene Kelas XI</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f7;color:#1f2937;font-family:Arial,sans-serif}header{background:#087f72;color:white;text-align:center;padding:22px 14px}main{max-width:900px;margin:20px auto;padding:0 14px}.panel,.question{background:white;border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 2px 9px #0001}.meta{display:flex;gap:14px;flex-wrap:wrap}input[type=text]{padding:10px;border:1px solid #cbd5e1;border-radius:8px}.question h3{font-size:16px;line-height:1.5;margin:0 0 12px}.option{display:block;padding:10px;margin:7px 0;border:1px solid #dbe3e8;border-radius:8px;cursor:pointer}.option:hover{background:#effaf8}.option input{margin-right:8px}button{border:0;border-radius:9px;padding:12px 17px;background:#087f72;color:white;font-weight:bold;cursor:pointer}#result{display:none}small{color:#64748b}.correct{color:#087f42}.wrong{color:#b42318}</style></head><body><header><h1>CBT – Personal Hygiene</h1><div>Layanan Penunjang Keperawatan dan Caregiving | Kelas XI</div></header><main><section class="panel"><div class="meta"><label>Nama peserta<br><input id="student" placeholder="Masukkan nama"></label><label>Kelas<br><input id="class" placeholder="Contoh: XI"></label><div><b>25 Soal</b><br><small>Termasuk 5 soal kasus HOTS</small></div></div><p><small>Pilih satu jawaban pada setiap soal, lalu tekan Selesai untuk melihat nilai.</small></p></section><div id="quiz"></div><section class="panel"><span id="progress">Terjawab 0 dari 25 soal</span><p><button id="finish">Selesai &amp; Lihat Nilai</button></p></section><section class="panel" id="result"></section></main><script>
const questions=[{"n": 1, "q": "Saat menangani pasien yang membutuhkan pertolongan buang air kecil (BAK), seorang tenaga layanan penunjang keperawatan dan caregiving dapat mempromosikan rasa aman dan kepercayaan dengan cara ...", "o": ["Mengabaikan kebutuhan privasi pasien selama proses eliminasi.", "Meninggalkan pasien sendirian selama proses eliminasi untuk memberikan privasi.", "Menjelaskan secara rinci proses eliminasi kepada pasien sebelum melakukannya.", "Memerintahkan pasien untuk mengikuti prosedur tanpa memberikan penjelasan lebih lanjut.", "Menganjurkan kepada klien untuk menginformasikan kepada keluarganya jika ingin BAK."], "a": 2}, {"n": 2, "q": "Ketika memberikan perawatan perineum kepada seorang pasien, tindakan yang paling tepat untuk menunjukkan empati adalah ...", "o": ["Menyelesaikan prosedur dengan cepat untuk mengurangi ketidaknyamanan pasien.", "Menggunakan bahasa yang jelas dan sopan, serta memperhatikan privasi pasien.", "Membiarkan pasien sendirian selama proses perawatan untuk memberikan privasi.", "Menyuruh pasien untuk melakukan tindakan tanpa memberikan penjelasan lebih lanjut.", "Mengandalkan asumsi tentang kebutuhan pasien berdasarkan pengalaman pribadi."], "a": 1}, {"n": 3, "q": "Alasan pentingnya membangun kepercayaan dengan pasien dalam konteks perawatan vulva dan perineum adalah ...", "o": ["Agar pasien terbiasa dengan prosedur medis.", "Untuk menghindari pertanyaan yang tidak perlu.", "Agar pasien merasa nyaman dan lebih kooperatif.", "Agar dapat menyelesaikan perawatan dengan cepat.", "Untuk mengatur jadwal perawatan dengan lebih efisien."], "a": 2}, {"n": 4, "q": "Seorang pasien lanjut usia mengeluh tentang kesulitan dalam menjaga kebersihan area vulva karena keterbatasan fisik. Hal yang dapat kalian lakukan untuk membantu pasien ini dengan empati adalah ...", "o": ["Menyarankan pasien untuk meminta bantuan dari anggota keluarga.", "Membiarkan pasien menangani masalah sendiri.", "Mengelola waktu untuk menyelesaikan perawatan dengan cepat.", "Menghindari pembicaraan tentang masalah tersebut.", "Menyediakan solusi praktis seperti alat bantu pembersih yang mudah digunakan."], "a": 4}, {"n": 5, "q": "Di bawah ini yang merupakan indikasi perawatan vulva dan perineum adalah ...", "o": ["Post partum yang tidak mampu membersihkan secara mandiri.", "Post partum yang mampu membersihkan secara mandiri.", "Post operation sectio caesaria.", "Riwayat penyakit menular seksual.", "Pasca laparotomi."], "a": 0}, {"n": 6, "q": "Perhatikan tindakan berikut setelah mengangkat perlak dan pengalas pada perawatan vulva dan perineum: (1) Bantu klien menggunakan pakaian bawah. (2) Bereskan alat dan merapikan klien. (3) Lepaskan sarung tangan dan rapikan alat. (4) Cuci tangan. (5) Dokumentasikan tindakan. Urutan tindakan yang tepat adalah ...", "o": ["2-3-4-5-1", "1-2-4-5-3", "1-2-3-5-4", "1-2-3-4-5", "5-4-3-2-1"], "a": 3}, {"n": 7, "q": "Perhatikan urutan tindakan memandikan berikut: (1) Wajah. (2) Dada dan perut. (3) Lengan. (4) Punggung. (5) Kaki. (6) Lipatan paha dan genitalia. Urutan yang tepat pada tindakan memandikan adalah ...", "o": ["1-3-2-4-5-6", "1-2-3-4-5-6", "1-3-5-4-6-2", "1-2-3-4-6-5", "1-3-2-5-4-6"], "a": 0}, {"n": 8, "q": "Alasan pentingnya menjelaskan langkah-langkah proses mencuci rambut kepada pasien sebelum memulai tindakan adalah ...", "o": ["Dapat membantu mengurangi kecemasan dan meningkatkan kepercayaan diri pasien.", "Dapat mempercepat proses mencuci rambut.", "Dapat mengurangi biaya perawatan di rumah sakit.", "Dapat membuat rambut pasien lebih berkilau.", "Dapat meningkatkan efisiensi layanan."], "a": 0}, {"n": 9, "q": "Di bawah ini merupakan tujuan dari mencuci rambut klien, kecuali ...", "o": ["Memberikan rasa nyaman.", "Menjaga rambut tetap bersih, rapi, dan terawat.", "Merangsang peredaran darah di kulit kepala.", "Mengeliminasi kutu/ketombe.", "Menurunkan daya tahan tubuh."], "a": 4}, {"n": 10, "q": "Manfaat memiliki keterampilan komunikasi yang baik saat memberikan perawatan kebersihan mulut pada pasien di rumah sakit adalah ...", "o": ["Agar dapat menjelaskan prosedur dengan jelas dan mendukung kerja sama pasien.", "Agar dapat menaikkan harga layanan perawatan kesehatan.", "Agar dapat menggunakan produk perawatan mulut yang lebih beragam.", "Agar dapat memberikan promosi produk perawatan kesehatan.", "Agar dapat menawarkan opsi perawatan mulut yang lebih banyak."], "a": 0}, {"n": 11, "q": "Alasan pentingnya membangun kepercayaan dengan pasien saat memberikan perawatan kebersihan mulut di rumah sakit atau panti lansia adalah ...", "o": ["Agar dapat menyelesaikan perawatan lebih cepat.", "Agar mengurangi biaya perawatan kesehatan.", "Agar membuat mulut pasien terasa lebih segar.", "Agar meningkatkan efisiensi prosedur perawatan.", "Agar pasien merasa nyaman dan menerima perawatan dengan lebih baik."], "a": 4}, {"n": 12, "q": "Indikasi menyikat gigi di atas tempat tidur adalah ...", "o": ["Mencegah timbulnya luka.", "Mencegah timbulnya infeksi.", "Mengkaji keadaan mulut klien.", "Klien yang tidak mampu melakukan perawatan mulut secara mandiri.", "Klien yang mampu melakukan perawatan mulut secara mandiri."], "a": 3}, {"n": 13, "q": "Perhatikan prosedur pertolongan oral hygiene berikut: (1) Memasang perlak dan alasnya di bawah dagu. (2) Membantu pasien berkumur sambil menyiapkan bengkok. (3) Membantu menyiapkan sikat dan pasta gigi. (4) Membantu pasien menyikat gigi bagian depan, samping, dan dalam. (5) Membantu pasien berkumur sambil menyiapkan bengkok. (6) Mengeringkan bibir menggunakan tisu. Urutan yang tepat adalah ...", "o": ["1-2-3-4-5-6", "2-3-4-5-6-1", "1-2-3-5-6-4", "2-1-3-4-5-6", "3-4-5-2-1-6"], "a": 0}, {"n": 14, "q": "Manfaat memiliki keterampilan komunikasi yang baik dalam kerja tim saat melakukan pemotongan kuku pada pasien di rumah sakit adalah ...", "o": ["Agar dapat berkoordinasi dengan baik dan memastikan semua anggota tim terlibat.", "Agar dapat menaikkan harga layanan perawatan kesehatan.", "Agar dapat menggunakan produk perawatan kuku yang lebih beragam.", "Agar dapat memberikan promosi produk perawatan kesehatan.", "Agar dapat menawarkan opsi pemotongan kuku yang lebih banyak."], "a": 0}, {"n": 15, "q": "Larutan yang terdapat dalam bengkok yang berfungsi agar kuku tidak berantakan dan untuk meminimalkan penyebaran penyakit melalui kuku adalah ...", "o": ["Air hangat.", "Air dingin.", "Lysol 1%.", "Klorin.", "Betadine."], "a": 2}, {"n": 16, "q": "Mengevaluasi kondisi kuku klien sebelum memulai prosedur menggunting kuku sangatlah penting, karena ...", "o": ["Agar dapat mengidentifikasi kondisi kuku yang memerlukan perawatan khusus.", "Agar dapat menyelesaikan prosedur lebih cepat.", "Agar mengurangi biaya perawatan kesehatan.", "Agar kuku pasien terlihat lebih rapi.", "Agar meningkatkan efisiensi dalam memberikan perawatan."], "a": 0}, {"n": 17, "q": "Tujuan utama menjaga privasi pasien selama tindakan personal hygiene adalah ...", "o": ["Agar tindakan selesai lebih cepat.", "Agar pasien merasa dihargai, aman, dan nyaman.", "Agar petugas tidak perlu berkomunikasi.", "Agar keluarga tidak mengetahui kondisi pasien.", "Agar alat yang digunakan lebih sedikit."], "a": 1}, {"n": 18, "q": "Sebelum melakukan tindakan personal hygiene, petugas sebaiknya terlebih dahulu ...", "o": ["Menyiapkan alat tanpa memeriksa pasien.", "Langsung memulai tindakan.", "Menjelaskan tindakan, mengidentifikasi pasien, dan memastikan kesiapan serta persetujuan pasien.", "Meminta pasien mengikuti semua instruksi tanpa bertanya.", "Menyelesaikan dokumentasi sebelum tindakan."], "a": 2}, {"n": 19, "q": "Prinsip membersihkan area genitalia pada perempuan adalah ...", "o": ["Dari anus ke arah uretra.", "Dari bagian yang paling kotor ke bagian yang paling bersih.", "Dari depan ke belakang untuk mengurangi risiko kontaminasi.", "Menggunakan satu kapas untuk seluruh area.", "Menggosok kuat agar cepat bersih."], "a": 2}, {"n": 20, "q": "Setelah melakukan personal hygiene, tindakan yang penting dilakukan adalah ...", "o": ["Meninggalkan alat di dekat pasien.", "Merapikan pasien dan lingkungan, membereskan alat, melakukan kebersihan tangan, serta mendokumentasikan sesuai kewenangan.", "Langsung meninggalkan ruangan.", "Menyimpan alat kotor bersama alat bersih.", "Tidak perlu melaporkan perubahan kondisi pasien."], "a": 1}, {"n": 21, "q": "Kasus HOTS 1 – Eliminasi BAK. Pasien pascaoperasi meminta bantuan BAK. Saat petugas mendekat, pasien mengatakan malu dan meminta pintu ditutup. Apa keputusan paling tepat?", "o": ["Mengabaikan permintaan karena tindakan harus segera dilakukan.", "Menjelaskan prosedur, menutup pintu/tirai, menjaga tubuh tetap tertutup, dan membantu sesuai kebutuhan pasien.", "Meminta pasien menunggu sampai keluarga datang.", "Membiarkan pasien mencoba sendiri meskipun belum aman bergerak.", "Mengurangi minum pasien agar tidak perlu BAK."], "a": 1}, {"n": 22, "q": "Kasus HOTS 2 – Vulva dan perineum. Saat membantu pasien nifas, petugas melihat pembalut sangat basah dan pasien mengeluh nyeri bertambah serta mengeluarkan cairan berbau. Tindakan paling tepat adalah ...", "o": ["Melanjutkan perawatan tanpa menyampaikan temuan.", "Mengoleskan bedak agar bau berkurang.", "Melakukan kebersihan sesuai prosedur, menjaga privasi, dan segera melaporkan temuan abnormal kepada perawat penanggung jawab.", "Menyarankan pasien mengganti pembalut sendiri tanpa bantuan.", "Menggosok area perineum lebih kuat."], "a": 2}, {"n": 23, "q": "Kasus HOTS 3 – Memandikan pasien. Pasien lansia memiliki kulit rapuh dan mengeluh perih saat digosok. Bagaimana petugas sebaiknya menyesuaikan tindakan?", "o": ["Menggosok lebih kuat agar kotoran terangkat.", "Menggunakan air sangat panas.", "Menghentikan gesekan kuat, membersihkan dengan lembut, mengeringkan dengan menepuk perlahan, dan melaporkan kelainan kulit.", "Mengabaikan keluhan karena mandi harus selesai.", "Menggunakan alkohol pada seluruh kulit."], "a": 2}, {"n": 24, "q": "Kasus HOTS 4 – Mencuci rambut. Pasien dengan keterbatasan gerak mengeluh sesak ketika posisi kepala diturunkan untuk mencuci rambut. Tindakan paling tepat adalah ...", "o": ["Melanjutkan dengan lebih cepat.", "Menghentikan tindakan, mengembalikan posisi aman/nyaman, mengkaji keluhan, dan segera meminta bantuan perawat.", "Meminta pasien menahan napas.", "Menambahkan air agar rambut cepat basah.", "Meninggalkan pasien untuk mengambil sampo."], "a": 1}, {"n": 25, "q": "Kasus HOTS 5 – Oral hygiene dan kuku. Pasien mengalami penurunan kesadaran dan terdapat sekret di rongga mulut. Sebelum membersihkan mulut, prioritas keselamatan adalah ...", "o": ["Memberikan air untuk berkumur.", "Memposisikan telentang datar.", "Memastikan posisi yang mengurangi risiko aspirasi, menggunakan alat sesuai prosedur, dan mengikuti arahan perawat.", "Memasukkan sikat sedalam mungkin.", "Meminta pasien menelan sekret."], "a": 2}],letters=['A','B','C','D','E'];const quiz=document.getElementById('quiz');
questions.forEach(q=>{let b=document.createElement('section');b.className='question';let h=document.createElement('h3');h.textContent=q.n+'. '+q.q;b.appendChild(h);q.o.forEach((o,i)=>{let l=document.createElement('label');l.className='option';let x=document.createElement('input');x.type='radio';x.name='q'+q.n;x.value=i;x.onchange=progress;l.appendChild(x);l.append(letters[i]+'. '+o);b.appendChild(l)});quiz.appendChild(b)});
function progress(){let n=questions.filter(q=>document.querySelector('input[name=q'+q.n+']:checked')).length;document.getElementById('progress').textContent='Terjawab '+n+' dari 25 soal'}
document.getElementById('finish').onclick=()=>{let name=document.getElementById('student').value.trim();if(!name){alert('Isi nama peserta terlebih dahulu.');return}let missing=questions.filter(q=>!document.querySelector('input[name=q'+q.n+']:checked'));if(missing.length&&!confirm('Masih ada '+missing.length+' soal belum dijawab. Tetap kumpulkan?'))return;let score=0,detail='';questions.forEach(q=>{let x=document.querySelector('input[name=q'+q.n+']:checked');let ok=x&&Number(x.value)===q.a;if(ok)score++;detail+='<p>Nomor '+q.n+': '+(ok?'<b class=correct>Benar</b>':'<b class=wrong>Salah/belum dijawab</b>')+' · Kunci '+letters[q.a]+'</p>'});let r=document.getElementById('result');r.style.display='block';r.innerHTML='<h2>Hasil CBT</h2><p>Nama: '+esc(name)+'<br>Kelas: '+esc(document.getElementById('class').value||'-')+'</p><h2>Nilai: '+Math.round(score/25*100)+'</h2><p>Benar '+score+' dari 25 soal.</p><hr>'+detail+'<button onclick=window.print()>Cetak Hasil</button>';r.scrollIntoView({behavior:'smooth'});document.querySelectorAll('input[type=radio]').forEach(x=>x.disabled=true);document.getElementById('finish').disabled=true};
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Siswa | Web Learning SIGAP</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .login-box {
      max-width: 420px;
      margin: 50px auto;
      padding: 28px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }

    .login-box h2 {
      text-align: center;
    }

    .login-box label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      margin-top: 22px;
      cursor: pointer;
      border: none;
      border-radius: 7px;
      background: #087f5b;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .login-box button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #pesan {
      margin-top: 14px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .info-sesi {
      padding: 12px;
      border-radius: 8px;
      background: #e9f7ef;
      margin-top: 15px;
    }

    .tersembunyi {
      display: none;
    }
  </style>
</head>

<body>
  <header class="navbar">
    <div class="logo">
      <span>LPKC</span>
      <small>SMKN 1 PAKONG</small>
    </div>

    <nav>
      <a href="index.html">Beranda</a>
      <a href="media.html">Media</a>
      <a href="bahan.html">Bahan</a>
    </nav>
  </header>

  <main class="login-box">
    <h2>Login Siswa SIGAP</h2>
    <p>Masuk untuk memulai kegiatan belajar.</p>

    <form id="formLogin">
      <label for="nisn">NISN</label>
      <input
        id="nisn"
        name="nisn"
        type="text"
        inputmode="numeric"
        autocomplete="username"
        pattern="[0-9]+"
        required
      >

      <label for="pin">PIN 6 digit</label>
      <input
        id="pin"
        name="pin"
        type="password"
        inputmode="numeric"
        pattern="[0-9]{6}"
        maxlength="6"
        autocomplete="current-password"
        required
      >

      <button id="tombolMasuk" type="submit">Masuk</button>
      <p id="pesan" role="status" aria-live="polite"></p>
    </form>

    <section id="statusSesi" class="info-sesi tersembunyi">
      <strong>Login berhasil</strong>
      <p id="identitasSiswa"></p>
      <p>Sesi belajar tersimpan pada tab browser ini.</p>
      <button id="tombolKeluar" type="button">Keluar</button>
    </section>
  </main>

  <footer>
    <h3>LPKC SMKN 1 PAKONG</h3>
    <p>Learning &amp; Practice Center</p>
  </footer>

  <script>
    // WAJIB: Ganti dengan URL Web App Apps Script milik Ibu.
    const URL_APPS_SCRIPT =
      "TEMPEL_URL_WEB_APP_IBU_DI_SINI";

    const formLogin = document.getElementById("formLogin");
    const inputNisn = document.getElementById("nisn");
    const inputPin = document.getElementById("pin");
    const tombolMasuk = document.getElementById("tombolMasuk");
    const tombolKeluar = document.getElementById("tombolKeluar");
    const pesan = document.getElementById("pesan");
    const statusSesi = document.getElementById("statusSesi");
    const identitasSiswa = document.getElementById("identitasSiswa");

    function tampilkanPesan(teks) {
      pesan.textContent = teks;
    }

    function tampilkanSesi(nama, kelas) {
      formLogin.classList.add("tersembunyi");
      statusSesi.classList.remove("tersembunyi");

      identitasSiswa.textContent =
        "Nama: " + nama + " | Kelas: " + kelas;
    }

    formLogin.addEventListener("submit", async function (e) {
      e.preventDefault();

      const nisn = inputNisn.value.trim();
      const pin = inputPin.value.trim();

      if (!/^[0-9]+$/.test(nisn)) {
        tampilkanPesan("NISN harus berisi angka.");
        return;
      }

      if (!/^[0-9]{6}$/.test(pin)) {
        tampilkanPesan("PIN harus tepat 6 digit.");
        return;
      }

      if (
        !URL_APPS_SCRIPT.startsWith(
          "https://script.google.com/macros/s/"
        ) ||
        !URL_APPS_SCRIPT.endsWith("/exec")
      ) {
        tampilkanPesan(
          "URL Apps Script belum benar. Periksa URL deployment."
        );
        return;
      }

      tombolMasuk.disabled = true;
      tampilkanPesan("Sedang memeriksa login...");

      try {
        const respons = await fetch(URL_APPS_SCRIPT, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            aksi: "login",
            nisn: nisn,
            pin: pin
          }),
          redirect: "follow"
        });

        if (!respons.ok) {
          throw new Error("Server tidak dapat dihubungi.");
        }

        const hasil = await respons.json();

        if (!hasil.sukses) {
          throw new Error(hasil.pesan || "Login gagal.");
        }

        if (!hasil.token || !hasil.nama) {
          throw new Error("Respons login tidak lengkap.");
        }

        sessionStorage.setItem("sigap_token", hasil.token);
        sessionStorage.setItem("sigap_nama", hasil.nama);
        sessionStorage.setItem("sigap_kelas", hasil.kelas || "");

        inputPin.value = "";
        tampilkanPesan("");

        tampilkanSesi(
          hasil.nama,
          hasil.kelas || "-"
        );

      } catch (error) {
        console.error("Kesalahan login SIGAP:", error);

        tampilkanPesan(
          "Login gagal. Periksa URL dan akses Apps Script. " +
          "Jika muncul masalah CORS, koneksi perlu diperbaiki."
        );

      } finally {
        tombolMasuk.disabled = false;
      }
    });

    tombolKeluar.addEventListener("click", function () {
      sessionStorage.removeItem("sigap_token");
      sessionStorage.removeItem("sigap_nama");
      sessionStorage.removeItem("sigap_kelas");

      statusSesi.classList.add("tersembunyi");
      formLogin.classList.remove("tersembunyi");

      inputNisn.value = "";
      inputPin.value = "";

      tampilkanPesan("Anda telah keluar dari sesi.");
    });

    // Pulihkan tampilan sesi dari tab yang sama.
    // Sesi server tetap harus divalidasi saat mencatat aktivitas.
    const tokenTersimpan =
      sessionStorage.getItem("sigap_token");

    const namaTersimpan =
      sessionStorage.getItem("sigap_nama");

    const kelasTersimpan =
      sessionStorage.getItem("sigap_kelas");

    if (tokenTersimpan && namaTersimpan) {
      tampilkanSesi(
        namaTersimpan,
        kelasTersimpan || "-"
      );
    }
  </script>
</body>
</html>

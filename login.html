<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Siswa | Web Learning SIGAP</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-box {
      max-width: 420px;
      margin: 50px auto;
      padding: 28px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }
    .login-box h2 { text-align: center; }
    .login-box label {
      display: block;
      margin-top: 16px;
    }
    .login-box input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      box-sizing: border-box;
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      margin-top: 22px;
      cursor: pointer;
    }
    #pesan { margin-top: 14px; text-align: center; }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <span>LPKC</span>
      <small>SMKN 1 PAKONG</small>
    </div>
    <nav>
      <a href="index.html">Beranda</a>
      <a href="media.html">Media</a>
      <a href="bahan.html">Bahan</a>
    </nav>
  </header>

  <main class="login-box">
    <h2>Login Siswa SIGAP</h2>
    <p>Masuk satu kali untuk memulai kegiatan belajar.</p>

    <form id="formLogin">
      <label for="nisn">NISN</label>
      <input id="nisn" name="nisn"
        inputmode="numeric" autocomplete="username"
        required>

      <label for="pin">PIN 6 digit</label>
      <input id="pin" name="pin" type="password"
        inputmode="numeric" pattern="[0-9]{6}"
        maxlength="6" autocomplete="current-password"
        required>

      <button type="submit">Masuk</button>
      <p id="pesan" role="status"></p>
    </form>
  </main>

  <footer>
    <h3>LPKC SMKN 1 PAKONG</h3>
    <p>Learning &amp; Practice Center</p>
  </footer>

  <script>
    document.getElementById('formLogin').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('pesan').textContent =
        'Tampilan siap. Integrasi login akan diaktifkan setelah koneksi server diuji.';
    });
  </script>
</body>
</html>

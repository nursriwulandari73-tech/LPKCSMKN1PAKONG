
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Siswa | Web Learning SIGAP</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      background: #f3f7fb;
      font-family: Arial, sans-serif;
    }

    .login-box {
      max-width: 420px;
      margin: 60px auto;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,.10);
    }

    .login-box h2 {
      text-align: center;
      color: #123b5d;
      margin-bottom: 10px;
    }

    .deskripsi {
      text-align: center;
      color: #526477;
      margin-bottom: 25px;
    }

    .login-box label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
      color: #263445;
    }

    .login-box input {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      box-sizing: border-box;
      border: 1px solid #ccd5df;
      border-radius: 8px;
      font-size: 16px;
    }

    .login-box input:focus {
      outline: none;
      border-color: #087f8c;
    }

    .login-box button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: none;
      border-radius: 8px;
      background: #087f8c;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-box button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #pesan {
      text-align: center;
      margin-top: 18px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    footer {
      text-align: center;
      margin-top: 45px;
      padding: 20px;
      color: #64748b;
    }

    @media(max-width: 500px) {
      .login-box {
        margin: 30px 15px;
        padding: 24px;
      }
    }
  </style>
</head>

<body>

  <header class="navbar">
    <div class="logo">
      <span>LPKC</span>
      <small>SMKN 1 PAKONG</small>
    </div>

    <nav>
      <a href="index.html">Beranda</a>
      <a href="media.html">Media</a>
      <a href="bahan.html">Bahan</a>
    </nav>
  </header>

  <main class="login-box">

    <h2>Login Siswa SIGAP</h2>

    <p class="deskripsi">
      Masuk untuk memulai kegiatan belajar.
    </p>

    <form id="formLogin">

      <label for="nisn">NISN</label>

      <input
        type="text"
        id="nisn"
        name="nisn"
        inputmode="numeric"
        autocomplete="username"
        pattern="[0-9]+"
        placeholder="Masukkan NISN"
        required
      >

      <label for="pin">PIN 6 Digit</label>

      <input
        type="password"
        id="pin"
        name="pin"
        inputmode="numeric"
        pattern="[0-9]{6}"
        maxlength="6"
        autocomplete="current-password"
        placeholder="Masukkan PIN"
        required
      >

      <button type="submit" id="tombolMasuk">
        MASUK
      </button>

      <p id="pesan" role="status" aria-live="polite"></p>

    </form>

  </main>

  <footer>
    <h3>LPKC SMKN 1 PAKONG</h3>
    <p>Learning &amp; Practice Center</p>
    <p>Ajhâr, Ngabdi, sareng Ngajhâga.</p>
  </footer>

  <script>

    // Koneksi Apps Script SIGAP
    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbwYgnZe0zx8QL0KniAZxJGxh6Eiihfo1ntcwtrdkwyxAahLd74Mbhjam-pRyJ1xlA2u2g/exec";

    const formLogin = document.getElementById("formLogin");
    const inputNisn = document.getElementById("nisn");
    const inputPin = document.getElementById("pin");
    const tombolMasuk = document.getElementById("tombolMasuk");
    const pesan = document.getElementById("pesan");

    function tampilkanPesan(teks, warna) {
      pesan.textContent = teks;
      pesan.style.color = warna || "#263445";
    }

    formLogin.addEventListener("submit", async function(e) {

      e.preventDefault();

      const nisn = inputNisn.value.trim();
      const pin = inputPin.value.trim();

      if (!/^[0-9]+$/.test(nisn)) {
        tampilkanPesan("NISN harus berupa angka.", "red");
        return;
      }

      if (!/^[0-9]{6}$/.test(pin)) {
        tampilkanPesan("PIN harus tepat 6 digit.", "red");
        return;
      }

      tombolMasuk.disabled = true;
      tombolMasuk.textContent = "MEMERIKSA LOGIN...";

      tampilkanPesan("Sedang memeriksa akun siswa...");

      try {

        const respons = await fetch(URL_APPS_SCRIPT, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            aksi: "login",
            nisn: nisn,
            pin: pin
          }),
          redirect: "follow"
        });

        if (!respons.ok) {
          throw new Error("Server tidak dapat dihubungi.");
        }

        const hasil = await respons.json();

        if (!hasil.sukses) {
          throw new Error(hasil.pesan || "Login gagal.");
        }

        if (!hasil.token || !hasil.nama) {
          throw new Error("Data login tidak lengkap.");
        }

        // Menyimpan identitas dan token siswa
        sessionStorage.setItem("sigap_token", hasil.token);
        sessionStorage.setItem("sigap_nama", hasil.nama);
        sessionStorage.setItem("sigap_kelas", hasil.kelas || "");

        // Mengosongkan PIN
        inputPin.value = "";

        tampilkanPesan(
          "Login berhasil! Mengarahkan ke dashboard siswa...",
          "green"
        );

        tombolMasuk.textContent = "BERHASIL";

        // Mengarahkan siswa ke dashboard
        window.location.replace("dashboard-siswa.html");

      } catch (error) {

        console.error("Login SIGAP:", error);

        tampilkanPesan(
          error.message || "Login gagal. Periksa koneksi internet.",
          "red"
        );

        tombolMasuk.disabled = false;
        tombolMasuk.textContent = "MASUK";

      }

    });

  </script>

</body>
</html>
